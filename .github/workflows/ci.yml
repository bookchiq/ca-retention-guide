name: CI

# Detection layer only: by the time this runs, a push is already public.
# Prevention is the local pre-commit and pre-push hooks (see .pre-commit-config.yaml).

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --python 3.12

      - name: Ruff
        run: uv run ruff check

      - name: Install gitleaks
        run: |
          curl -fsSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Tests
        run: uv run pytest -q

      - name: Public-repo guard
        run: uv run python -m src.guard

      - name: Secret scan (full history)
        run: gitleaks git --redact --no-banner --config .gitleaks.toml

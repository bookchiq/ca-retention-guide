[project]
name = "ca-retention-guide"
version = "0.1.0"
description = "Nonpartisan, source-linked records of California appellate justices on the Nov 3, 2026 retention ballot."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "tenacity>=9.0",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "rapidfuzz>=3.9",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "pre-commit>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

# Topic keyword sets (SPEC §7.4). Matching is case-insensitive on whole words,
# with "§" normalized to "section". An opinion is tagged when it has any anchor
# or at least 3 distinct broader terms (KTD9). The San Diego reading queue uses
# a looser match: any anchor or at least 1 broader term (KTD7).
# Log every change to this file in DECISIONS.md.
#
# definition: what "addresses the topic" means when labeling validation samples and on
#   the methodology page. The court must decide an issue in the topic (on the merits, or
#   ruling it forfeited, waived, moot, or not cognizable); a mention in the facts, the
#   procedural history, or a string cite does not count.
# probe: plain lowercase substrings used only to draw the recall sample (untagged
#   opinions that contain one of them), never to tag.

search_seizure:
  tier: 1
  validated: true    # report_tags.md round 2: 98% precision (2026-10-18)
  definition: >-
    The court decides a search or seizure claim: Fourth Amendment claims, motions to
    suppress (Pen. Code § 1538.5), warrant sufficiency, warrantless searches and their
    exceptions, detentions and stops, the lawfulness of an arrest, or CalECPA suppression.
  # Counted as "addressing" the topic only when it is litigated, not just mentioned
  # (KTD9). Added 2026-10-18 after the anchor-or-3-broad rule measured 28% precision.
  tag_rule:
    min_distinct_anchors: 2
    core_terms: [fourth amendment, motion to suppress, section 1538.5, suppression]
    min_core_hits: 4
  anchors:
    - fourth amendment
    - motion to suppress
    - section 1538.5
    - search warrant
    - warrantless
    - exclusionary rule
    - calecpa
    - electronic communications privacy act
    - section 1546
  broad:
    - probable cause
    - reasonable suspicion
    - detention
    - consent to search
    - good faith exception
    - leon
    - inevitable discovery
    - terry stop
    - pat-down
    - probation search
    - parole search
    - fourth waiver
    - knock-notice
    - franks hearing
    - geofence
    - cell site
    - automobile exception
    - search incident to arrest
  issue_types: [warrant_sufficiency, warrantless_exception, detention_or_stop, consent,
                probation_parole_search, electronic_data, vehicle, home_entry, other]
  outcomes: [evidence_suppressed_or_search_held_unlawful, search_upheld, mixed, not_reached]

interrogation:
  tier: 2
  validated: false
  # Round-1 candidate (2026-10-18): fit on labels_topic_interrogation_r1.csv; must pass a
  # fresh round-2 sample before the topic is shown.
  tag_rule:
    min_distinct_anchors: 2
    min_anchor_occurrences: 8
  definition: >-
    The court decides whether a defendant's statements to police or other government
    agents were admissible: Miranda warnings, waiver, or invocation; custody; or whether
    a confession or admission was voluntary.
  anchors: [miranda, custodial interrogation, voluntariness, involuntary confession]
  broad: []
  probe: [confession, interrogat, admonition, statements to police, invoked his right,
          invoked her right]


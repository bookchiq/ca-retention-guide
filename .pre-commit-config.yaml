# Install once per clone:  uv run pre-commit install
# Installs both pre-commit and pre-push hooks (the repo is public; push = publish).
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: public-repo-guard
        name: public-repo guard (index)
        entry: uv run python -m src.guard
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: public-repo-guard-push
        name: public-repo guard (outgoing commits)
        entry: uv run python -m src.guard --push
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: gitleaks-staged
        name: gitleaks (staged)
        entry: gitleaks git --pre-commit --staged --redact --no-banner --config .gitleaks.toml
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: gitleaks-history
        name: gitleaks (full history)
        entry: gitleaks git --redact --no-banner --config .gitleaks.toml
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: ruff
        name: ruff
        entry: uv run ruff check
        language: system
        types: [python]
        stages: [pre-commit]

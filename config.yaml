# Project configuration. Secrets live in .env (gitignored), never here.

project:
  name: ca-retention-guide
  repo_url: https://github.com/bookchiq/ca-retention-guide
  # Owner decisions, 2026-10-18.
  credit: An experiment by Sarah Lewis
  correction_contact: >-
    This guide is an experiment and a work in progress. If you find an error, please open an
    [issue](https://github.com/bookchiq/ca-retention-guide/issues) or a
    [pull request](https://github.com/bookchiq/ca-retention-guide/pulls) on GitHub, or email
    Sarah Lewis at sarah@happyhumans.com. Corrections are logged in
    [DECISIONS.md](https://github.com/bookchiq/ca-retention-guide/blob/main/DECISIONS.md).

window:
  # Default window for Court of Appeal opinions (SPEC §3). Owner decision point: R6.
  start: "2020-01-01"
  # Supreme Court opinions are fetched from this date.
  supreme_court_start: "2019-01-01"

bulk:
  snapshot: "2026-09-30"
  courts: [calctapp, cal]

api:
  base: https://www.courtlistener.com/api/rest/v4/
  # Fixed spacing keeps a run under the documented 50 requests/hour limit.
  min_interval_seconds: 80
  # Stop rather than wait longer than this on a 429 Retry-After.
  max_retry_after_seconds: 3600

render:
  # "Last updated" date printed on every page; never the wall clock (KTD12).
  # Owner decision 2026-10-18: set to the day the pages are generated for publication.
  snapshot_date: "2026-10-19"

phase:
  tier2_enabled: false

paths:
  raw: data/raw
  bulk: data/raw/bulk
  database: data/cases.sqlite
  drafts: data/drafts
  review: data/review
  case_notes: data/case_notes.jsonl
  validation: data/validation
  guide: guide
